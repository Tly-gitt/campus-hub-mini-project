services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: campus_hub
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - campus-hub-network

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/campus_hub?createDatabaseIfNotExist=true"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - campus-hub-network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - campus-hub-network

volumes:
  mysql_data:

networks:
  campus-hub-network:
    driver: bridge
